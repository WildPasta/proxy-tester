[project]
name = "proxy-tester"
version = "0.1.0"
description = "Async CLI tool to test HTTP/HTTPS/SOCKS4/SOCKS5 proxies from a file"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx[socks]>=0.28.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
proxy-tester = "proxy_tester.cli:main"

[build-system]
requires = ["setuptools>=84.2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["proxy_tester"]
