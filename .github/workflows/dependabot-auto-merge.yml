name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-24.04
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          skip-commit-verification: true
      - name: Enable auto-merge (patch, minor & pip requirement updates)
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          (steps.metadata.outputs.update-type == '' &&
           steps.metadata.outputs.package-ecosystem == 'pip')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependabot reliably deletes its branch when a human merges the PR, but
  # not when GitHub's auto-merge does it, so clean up here.
  delete-branch:
    runs-on: ubuntu-24.04
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    steps:
      - name: Delete merged Dependabot branch
        env:
          REPO: ${{ github.event.repository.full_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tolerate "reference does not exist" (branch already deleted via the
        # repo's auto-delete setting) so the job stays green.
        run: gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || echo "::warning::branch $BRANCH was already deleted"
